<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ee7f2e">
<title>Harol · Portfolio</title>
<meta name="description" content="Harol's portfolio: a Siemens-style phone OS in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>
<section class="lcd" id="lcd" aria-label="Portfolio">
  <div class="frame">
    <header class="status" aria-label="Status bar">
      <button class="signal" id="signal" type="button">
        <svg viewBox="0 0 7 13" aria-hidden="true"><path fill="currentColor" d="M0 0h7L4 4v9H3V4z"/></svg>
        <i style="height:.25em"></i><i style="height:.42em"></i><i style="height:.6em"></i><i style="height:.78em"></i><i style="height:.95em"></i>
      </button>
      <button class="env" id="env" type="button" aria-label="See my email">
        <svg viewBox="0 0 15 11" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M1 1h13v9H1zM1 1l6.5 5L14 1"/></svg>
      </button>
      <button class="batt" id="batt" type="button"><span class="cell"><i id="battFill"></i></span></button>
    </header>

    <div class="screen">
      <div class="view boot on" id="v-boot" aria-hidden="true">
        <svg class="logo" id="logo" role="img" aria-label="Logo //stev"></svg>
        <p class="who" id="bootName"></p>
        <p class="role" id="bootRole"></p>
        <p class="pct" id="bootPct">0%</p>
      </div>

      <div class="view home" id="v-home">
        <p class="operator" id="operator"></p>
        <p class="clock" id="clock">--:--</p>
        <p class="date" id="date"></p>
        <p class="phrase"><span id="phrase"></span><span class="caret">_</span></p>
      </div>

      <div class="view menu" id="v-menu">
        <h1 class="titlebar"><span>Menu</span><small id="pos"></small></h1>
        <div class="listwrap">
          <ol class="list" id="list"></ol>
          <div class="scroll" aria-hidden="true"><i id="thumb"></i></div>
        </div>
      </div>

      <div class="view page" id="v-page">
        <h1 class="titlebar"><span id="pgTitle"></span></h1>
        <div class="listwrap">
          <div class="pagebody" id="pgBody"></div>
          <div class="scroll" id="pgScroll" aria-hidden="true"><i id="pgThumb"></i></div>
        </div>
      </div>

      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
      <div class="popup" id="popup" role="dialog" aria-live="polite" hidden>
        <p class="ptitle" id="ptitle"></p>
        <div class="pbody" id="pbody"></div>
      </div>
    </div>

    <p class="hint">↑ ↓ move · Enter select · Esc back · 1–6 shortcuts</p>
    <footer class="softkeys">
      <button id="skL" type="button"></button>
      <button id="skR" type="button"></button>
    </footer>
  </div>
</section>

<script type="module" src="/src/main.js"></script>
</body>
</html>
